[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ravin-moodle-downloader"
version = "0.6.0"
description = "Scan, download, and browse authorized Moodle course materials"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Meghdad Fadaee"}]
keywords = ["moodle", "downloader", "lms", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
]
dependencies = ["selenium>=4.46,<5"]

[project.scripts]
ravin = "ravin.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
