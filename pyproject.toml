[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ravin-moodle-downloader"
version = "0.2.0"
description = "List and download authorized course files from Ravin Academy or another Moodle site"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Meghdad Fadaee"}]
keywords = ["moodle", "downloader", "lms", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
browser = ["selenium>=4.46,<5"]

[project.scripts]
ravin-downloader = "ravin_downloader:main"

[tool.setuptools]
py-modules = ["ravin_downloader"]
